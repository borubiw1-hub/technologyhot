<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', Arial, sans-serif;
        }

        body {
            /* ছবির মতো ডার্ক গ্রেডিয়েন্ট ব্যাকগ্রাউন্ড */
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 400px; /* মোবাইল ফ্রেন্ডলি সাইজ */
        }

        .top-text {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .image-container {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 25px;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .play-btn {
            display: block;
            width: 100%;
            background: linear-gradient(90deg, #ff00cc, #333399);
            color: white;
            text-decoration: none;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 0, 204, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 0, 204, 0.6);
        }

        .fallback-link {
            color: #aaa;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
        }
        
        .fallback-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- উপরের টেক্সট -->
        <div class="top-text">Learn more watch now video 😍</div>

        <!-- ইমেজ সেকশন -->
        <div class="image-container">
            <!-- 
              ⚠️ এখানে আপনার ইমেজের লিংক বসান। 
              আপনি চাইলে গিটহাবে ছবিটি আপলোড করে সেখানকার লিংক দিতে পারেন (যেমন: src="image.jpg")
            -->
            <img src="thumb.jpg" alt="Video Thumbnail">
        </div>

        <!-- প্লে বাটন -->
        <a href="#" id="playButton" class="play-btn">PLAY NOW ➜</a>

        <!-- ফলব্যাক লিংক -->
        <a href="#" id="fallbackLink" class="fallback-link">Button not working? Open it here</a>
    </div>

    <script>
        // ⚠️ এখানে আপনার Adsterra লিংকটি দিন
        const adsterraLink = "https://falsifydwight.com/bexeu3tfj?key=fbfdda37e0b10d50aff3f77380a7db66"; 

        // বাটন এবং নিচের লিংকে ক্লিক করলে অ্যাডস্ট্রেরা লিংকে নিয়ে যাবে
        document.getElementById('playButton').href = adsterraLink;
        document.getElementById('fallbackLink').href = adsterraLink;

        // ১ সেকেন্ড (১০০০ মিলিসেকেন্ড) পর অটোমেটিক রিডাইরেক্ট হবে
        setTimeout(function() {
            window.location.href = adsterraLink; 
        }, 2000); // 2 সেকেন্ড
    </script>

</body>
</html>
