<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', Arial, sans-serif;
        }
        body {
            background-color: #0f0f0f; /* ডার্ক থিম */
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            flex-direction: column;
        }
        h1 {
            font-size: 80px;
            color: #ff0000; /* ইউটিউব লাল */
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #ff0000;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-weight: 500;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <h1>404</h1>
    <p>Oops! The page you are looking for does not exist.</p>
    <a href="https://technologydaily.xyz" class="btn">Go Back Home</a>

</body>
</html>
