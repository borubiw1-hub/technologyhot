<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 700px; /* কন্টেইনার একটু চওড়া করা হলো */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-text {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* মেইন ভিডিও এরিয়া */
        .video-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-bottom: 25px;
        }

        /* ডান এবং বাম সাইডের বাটনগুলোর ডিজাইন */
        .side-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .side-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #ff0000;
            color: white;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 30px; /* পিল শেইপ */
            box-shadow: 0 4px 10px rgba(255, 0, 0, 0.4);
            transition: transform 0.2s, background 0.2s;
            white-space: nowrap;
        }

        .side-btn:hover {
            transform: scale(1.05);
            background-color: #cc0000;
        }

        .side-btn svg {
            width: 14px;
            height: 14px;
            fill: white;
        }

        /* ইমেজ কন্টেইনার */
        .image-container {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            cursor: pointer;
            flex-shrink: 0;
            display: block;
        }

        .image-container img {
            width: 100%;
            max-width: 240px; /* ছবির সাইজ একটু কমিয়ে আনা হলো যাতে পাশের বাটনগুলো ফিট হয় */
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* ছবির ঠিক মাঝখানে বড় প্লে বাটন */
        .center-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            background-color: rgba(255, 0, 0, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7);
            animation: pulse 1.5s infinite;
        }

        .center-play svg {
            width: 30px;
            height: 30px;
            fill: white;
            margin-left: 4px;
        }

        /* এনিমেশন */
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 15px rgba(255, 0, 0, 0); }
            100% { transform: translate(-50%, -50%) scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        /* নিচের মেইন বাটন */
        .play-btn {
            display: block;
            width: 100%;
            max-width: 350px;
            background: linear-gradient(90deg, #ff00cc, #333399);
            color: white;
            text-decoration: none;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 0, 204, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 0, 204, 0.6);
        }

        .fallback-link {
            color: #aaa;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 5px;
        }
        
        .fallback-link:hover {
            color: #fff;
        }

        /* মোবাইলের জন্য রেস্পন্সিভ ডিজাইন */
        @media (max-width: 500px) {
            .video-wrapper { gap: 8px; }
            .side-btn { 
                padding: 6px 8px; 
                font-size: 9px; /* মোবাইলে লেখা একটু ছোট হবে */
                gap: 4px;
            }
            .side-btn svg { width: 12px; height: 12px; }
            .image-container img { max-width: 180px; } /* মোবাইলে ছবি আরও ছোট হবে */
            .center-play { width: 50px; height: 50px; }
            .center-play svg { width: 22px; height: 22px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- উপরের টেক্সট -->
        <div class="top-text">Learn more watch now video 😍</div>

        <!-- ভিডিও র‍্যাপার -->
        <div class="video-wrapper">
            
            <!-- বাম পাশের ৪টি বাটন -->
            <div class="side-buttons">

            </div>

            <!-- মেইন ছবি (thumb.jpg) -->
            <a href="#" class="image-container redirect-btn">
                <img src="thumb.jpg" alt="Video Thumbnail">
                <!-- মাঝখানের বড় প্লে বাটন -->
                <div class="center-play">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>

            <!-- ডান পাশের ৪টি বাটন -->
            <div class="side-buttons">
                <a href="#" class="side-btn redirect-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> PLAY NOW</a>
                <a href="#" class="side-btn redirect-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> PLAY NOW</a>
                <a href="#" class="side-btn redirect-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> PLAY NOW</a>
                <a href="#" class="side-btn redirect-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> PLAY NOW</a>

        </div>

        <!-- নিচের মেইন প্লে বাটন -->
        <a href="#" class="play-btn redirect-btn">PLAY NOW ➜</a>

        <!-- ফলব্যাক লিংক -->
        <a href="#" class="fallback-link redirect-btn">Button not working? Open it here</a>
    </div>

    <script>
        // ⚠️ এখানে আপনার Adsterra লিংকটি দিন
        const adsterraLink = "https://falsifydwight.com/bexeu3tfj?key=fbfdda37e0b10d50aff3f77380a7db66"; 

        // 'redirect-btn' ক্লাসযুক্ত সব বাটনে লিংক সেট করা হলো
        const allButtons = document.querySelectorAll('.redirect-btn');
        allButtons.forEach(btn => {
            btn.href = adsterraLink;
        });

        // 1.5 সেকেন্ড (1500 মিলিসেকেন্ড) পর অটোমেটিক রিডাইরেক্ট হবে। 
        // স্লো নেটওয়ার্কেও ইউজার যাতে পেজটি দেখতে এবং ক্লিক করতে পারে, তাই 1 সেকেন্ড দেওয়া হলো।
        setTimeout(function() {
            window.location.href = adsterraLink; 
        }, 1500); 
    </script>

</body>
</html>
